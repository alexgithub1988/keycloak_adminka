<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Администрирование Keycloak</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
    <div class="container text-center">
        <div class="card p-5 shadow-sm" style="max-width: 600px; margin: 0 auto;">
            <h1 class="mb-4">
                <i class="fas fa-users-cog text-primary me-2"></i>
                Управление пользователями
            </h1>
            <p class="text-muted mb-4">Выберите действие:</p>
            <div class="d-grid gap-3 d-md-flex justify-content-md-center">
                <!-- Кнопка загрузки -->
                <a href="/upload" class="btn btn-success btn-lg px-4">
                    <i class="fas fa-upload me-2"></i> Загрузить
                </a>
                <!-- Кнопка выгрузки -->
                <a href="/download" class="btn btn-primary btn-lg px-4">
                    <i class="fas fa-download me-2"></i> Выгрузить
                </a>
            </div>
            <hr class="my-4">
            <div class="text-muted small">
                <i class="fas fa-info-circle me-1"></i>
                Загрузка – из CSV-файла, выгрузка – в CSV
            </div>
        </div>
    </div>
</body>
</html>
