<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Админка</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Главный контейнер (fluid растягивает его на весь экран) -->
<div class="container-fluid">
    <div class="row">

        <!-- СЛЕВА: Боковое меню (занимает 3 колонки из 12) -->
        <nav class="col-md-3 bg-light min-vh-100 p-3 border-end">
            <h4 class="px-3 mb-4 text-primary">Панель</h4>

            <ul class="nav nav-pills flex-column">
                <li class="nav-item mb-2">
                    <!-- ЕДИНАЯ ФОРМА: содержит и выбор реалма, и загрузку файла -->
                    <form action="/files/upload" method="post" enctype="multipart/form-data" id="uploadForm">
                        <!-- Выпадающий список с выбором реалма -->
                        <select name="realm" class="form-select mb-2">
                            {% for r in realm %}
                                <option value="{{ r }}" {% if loop.first %}selected{% endif %}>{{ r }}</option>
                            {% endfor %}
                        </select>

                        <!-- Поле для файла (скрытое) -->
                        <input type="file" name="file" id="fileInput" accept=".csv" style="display:none;"
                               onchange="this.form.submit()">

                        <!-- Ссылка-кнопка для выбора файла -->
                        <label for="fileInput" class="nav-link link-dark" style="cursor: pointer;">
                            Загрузить файл с пользователями
                        </label>
                    </form>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link link-dark" href="#">Получить файл с пользователями</a>
                </li>
                <!-- Удалена вторая дублирующая форма -->
            </ul>
        </nav>

        <!-- СПРАВА: Основной контент (занимает 9 колонок из 12) -->
        <main class="col-md-9 p-4">
            {% block content %}
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Панель управления</h1>
            </div>

            <p class="lead">Если этот текст справа, а меню серое слева — значит, всё работает!</p>

            <div class="alert alert-success" role="alert">
                Bootstrap успешно подключился. Стили на месте!
            </div>
            {% endblock %}
        </main>

    </div>
</div>

<!-- Скрипты Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
