<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель Keycloak</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 bg-light min-vh-100 p-3 border-end">
                <h4 class="px-3 mb-4 text-primary">Панель</h4>
                <ul class="nav nav-pills flex-column">
                    <li class="nav-item mb-2">
                        <select id="realmSelect" class="form-select mb-2">
                            {% for r in realm %}
                                <option value="{{ r }}" {% if loop.first %}selected{% endif %}>{{ r }}</option>
                            {% endfor %}
                        </select>
                    </li>
                    <li class="nav-item mb-2">
                        <form action="/files/upload" method="post" enctype="multipart/form-data" id="uploadForm">
                            <input type="hidden" name="realm" id="uploadRealmField" value="">
                            <input type="file" name="file" id="fileInput" accept=".csv" style="display:none;"
                                   onchange="updateRealmAndSubmit('uploadForm')">
                            <button type="button" class="btn btn-primary w-100" onclick="document.getElementById('fileInput').click()">
                                Загрузить CSV
                            </button>
                        </form>
                    </li>
                    <li class="nav-item mb-2">
                        <button type="button" class="btn btn-success w-100" onclick="downloadUsers(event)">
                            Скачать пользователей
                        </button>
                    </li>
                </ul>
            </nav>
            <main class="col-md-9 p-4">
                {% if message %}
                <div class="alert alert-{{ message.type }} alert-dismissible fade show" role="alert">
                    {{ message.text }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function getSelectedRealm() {
            return document.getElementById('realmSelect').value;
        }

        function updateRealmAndSubmit(formId) {
            const selectedRealm = getSelectedRealm();
            const realmField = document.getElementById('uploadRealmField');
            realmField.value = selectedRealm;
            document.getElementById(formId).submit();
        }

        function downloadUsers(event) {
            event.preventDefault();
            const selectedRealm = getSelectedRealm();
            const downloadUrl = `/download?realm=${encodeURIComponent(selectedRealm)}`;
            window.location.href = downloadUrl;
        }
    </script>
</body>
</html>
