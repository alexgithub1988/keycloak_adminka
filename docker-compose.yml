services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak_adminka_keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    command: start-dev
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - keycloak_network

  init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keycloak_adminka_init
    entrypoint: python3 /code/init_keycloak.py
    env_file:
      - .env
    volumes:
      - ./init_keycloak.py:/code/init_keycloak.py
    depends_on:
      - keycloak
    networks:
      - keycloak_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keycloak_adminka_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      KEYCLOAK_URL: "http://keycloak:8080"
      REDIRECT_URI: "http://localhost:8000"
    depends_on:
      - init
    volumes:
      - ./audit.db:/code/audit.db
      - ./upload_files:/code/upload_files
      - ./download_files:/code/download_files
      - ./uploads:/code/uploads
    restart: unless-stopped
    networks:
      - keycloak_network

networks:
  keycloak_network:
    driver: bridge

volumes:
  keycloak_data:
