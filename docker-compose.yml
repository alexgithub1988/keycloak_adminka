version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keycloak_adminka_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./audit.db:/code/audit.db
      - ./upload_files:/code/upload_files
      - ./download_files:/code/download_files
      - ./uploads:/code/uploads
    restart: unless-stopped
    networks:
      - keycloak_network

networks:
  keycloak_network:
    driver: bridge
