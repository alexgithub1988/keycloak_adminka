repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace      # убирает пробелы в конце строк
      - id: end-of-file-fixer        # добавляет пустую строку в конце файла
      - id: check-yaml               # проверяет валидность YAML
      - id: check-added-large-files  # не даёт закоммитить файлы >500KB

  # Ruff — линтер и форматтер
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix]   # автоматически исправляет ошибки
      - id: ruff-format # форматирует код
